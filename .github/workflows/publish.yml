name: Publish

on:
  push:
    tags:
      - '*@*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --projects=tag:publishable --parallel=3

      - name: Extract package info from tag
        id: package-info
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Extract package name (everything before the last @)
          PACKAGE_NAME="${TAG%@*}"
          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          # Extract version (everything after the last @)
          VERSION="${TAG##*@}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          PACKAGE_NAME: ${{ steps.package-info.outputs.package }}
        run: |
          pnpm nx release publish --projects="$PACKAGE_NAME"
