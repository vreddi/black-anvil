name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no changes will be made)'
        required: false
        default: 'false'
        type: boolean
      first_release:
        description: 'First release (skip changelog generation from commits)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - develop
    paths:
      - '.nx/version-plans/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --projects=tag:publishable --parallel=3

      - name: Version and Changelog (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          pnpm nx release --dry-run ${{ inputs.first_release == true && '--first-release' || '' }}

      - name: Version and Changelog
        if: ${{ inputs.dry_run != true }}
        run: |
          pnpm nx release ${{ inputs.first_release == true && '--first-release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes and tags
        if: ${{ inputs.dry_run != true }}
        run: |
          git push
          git push --tags
